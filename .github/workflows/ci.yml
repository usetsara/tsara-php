name: PHP SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer check
      - run: composer audit
      - run: composer archive --format=zip --dir=/tmp/tsara-package
